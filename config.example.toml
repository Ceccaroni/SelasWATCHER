# SelasWATCHER — Beispiel-Config.
# Kopieren nach config.toml (im CWD oder ~/.selaswatcher/) und anpassen.
# config.toml ist in .gitignore (reale Watchlist bleibt lokal).
# Fehlt config.toml, laufen diese Werte als eingebaute Defaults.

poll_interval_seconds = 300

# Quellen an/aus. Nicht gelistete Quellen gelten als aktiviert.
[sources]
# BACS/NCSC "Aktuelle Vorfälle": kein Feed -> HTML-Polling (always_high, kuratierte CH-Behörde).
"bacs" = true
"inside-it" = true
"20min" = true
# cisa-advisories: DEAKTIVIERT (S014, 2026-11). CISA blockt alle .xml-Feeds per Akamai-WAF
# gegen Skript-Clients (403 unabhängig vom User-Agent; mehrfach extern belegt). Kein offener
# Ersatz (kein JSON/API; CSAF deckt nur ICS/VA, nicht die Alerts). always_high-Netz trägt über
# BACS + CERT-Bund; aktiv-ausgenutzte CVEs laufen weiter über cisa-kev. Kehrt S003 um.
"cisa-advisories" = false
"cisa-kev" = true
"cert-bund-wid" = true
"buerger-cert" = true
"heise-security" = true
"bleepingcomputer" = true
# NVD: Firehose (jede CVE, matcht ganze Ökosysteme) -> aus. KEV/GitHub/CERT-Bund decken den Stack ab.
"nvd" = false
"github-advisory" = true

[github]
# Ökosysteme für die GitHub Advisory DB (nur das genutzte).
ecosystems = ["npm"]

[state]
# Max. gesehene IDs je Quelle im Dedup-State (seen.json). Älteste werden beim
# Überschreiten gedeckelt. Großzügig über jedem Feed-Fenster -> kein Re-Alarm
# alter Einträge. 0 = Deckeln aus.
seen_cap = 2000

[inventory]
# Welche Pakete setzt du WIRKLICH ein? Repo-Verzeichnisse mit package-lock.json.
# GitHub-Advisories werden paketgenau dagegen gematcht (Dependabot-Prinzip):
# Alarm nur, wenn ein tatsächlich genutztes Paket (inkl. transitiv) betroffen ist.
# Leer = Fallback auf die Titel-Watchlist unten.
project_paths = [
    # "/Users/DU/Documents/REPOS/dein-projekt",
]
# Zusätzliche Paketnamen von Hand (falls kein Lockfile vorliegt):
extra_packages = []

[scoring]
# Technologie-Watchlist (Wortgrenzen): Treffer => HIGH (lautes Banner).
# Nur der echte Stack. Bewusst NICHT 'node'/'php' (fangen ganze Ökosysteme).
# Erweitern = eine Zeile, z. B. "redis". PHP-Krisen kommen über News/Kritisch-Keywords.
watchlist = [
    "nextjs",
    "next.js",
    "node.js",
    "supabase",
    "postgres",
    "postgresql",
    "docker",
    "infomaniak",
]

# HIGH-Stichwörter (de + en), case-insensitive.
high_keywords = [
    "zero-day",
    "0-day",
    "actively exploited",
    "aktiv ausgenutzt",
    "in the wild",
    "remote code execution",
    "rce",
    "emergency patch",
    "notfall-patch",
    "unauthenticated",
]

# Generische Security-Keywords => MEDIUM.
generic_keywords = [
    "cve",
    "vulnerability",
    "schwachstelle",
    "sicherheitslücke",
    "sicherheitsupdate",
    "exploit",
    "advisory",
    "patch",
    "malware",
    "phishing",
    "trojan",
    "backdoor",
    "privilege escalation",
    "denial of service",
    # Breach/Leak- UND Ransomware-Begriffe bewusst nur MEDIUM (stumm): erst HIGH, wenn sie
    # unseren Stack/Provider (Watchlist) oder einen Host-/Infra-Term nennen. Ein Dringlichkeits-
    # Keyword ALLEIN genuegt seit TICKET-004 nicht mehr (stack-fremd -> MEDIUM). Nacktes
    # "ransomware"/"breach" ist Fremd-Laerm (z. B. Safepay gegen eine CH-Gemeinde) — Liste statt Banner (S006).
    "datenleck",
    "data breach",
    "breach",
    "ransomware",
]

# Host-/Infra-Terme: Selas self-hostet (Ubuntu-VPS + Docker). Ein Dringlichkeits-Keyword
# (zero-day/rce/aktiv ausgenutzt) AUF einem dieser Terme bleibt HIGH, auch ohne Stack-Paket
# in der Watchlist — Kernel/OS/SSH/TLS/Container-Escape sind host-relevant (S010). 'docker'
# faellt schon unter die Watchlist. Ein Dringlichkeits-Keyword OHNE Infra/Stack -> MEDIUM (TICKET-004).
infra_keywords = [
    "linux",
    "kernel",
    "ubuntu",
    "openssh",
    "openssl",
    "glibc",
    "containerd",
    "runc",
]
